name: PR Lint

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-lint-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Enforce Conventional-Commit PR titles so the squash-merge commit (and the
  # Renovate/changelog tooling that keys off `deps`/`feat`/`fix` scopes) stays
  # machine-parseable.
  pr-title:
    name: Conventional-Commit PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@7f33ba792281b034f64e96f4c0b5496782dd3b37 # v6.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.

  # DCO sign-off check — every commit in the PR must carry a `Signed-off-by:`
  # trailer (git commit -s). Mirrors the engine ci.yml `dco` job.
  dco:
    name: DCO check
    runs-on: ubuntu-latest
    # Human PRs must carry a Signed-off-by trailer (git commit -s); bot PRs
    # (Renovate, etc.) are exempt so dependency auto-merge is never blocked.
    if: github.event.pull_request.user.type != 'Bot'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Check DCO sign-off
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          MISSING=0
          while IFS= read -r sha; do
            if ! git log -1 --pretty=full "$sha" | grep -q "^Signed-off-by:"; then
              echo "::error::Commit $sha is missing a Signed-off-by trailer"
              MISSING=$((MISSING+1))
            fi
          done < <(git log --pretty=format:"%H" "${BASE}..${HEAD}")
          [ "$MISSING" -eq 0 ] || exit 1
