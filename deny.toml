# cargo-deny configuration for pdf_oxide_api.
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
unmaintained = "none"
yanked = "deny"
# Inherited from the pdf_oxide engine's dependency graph. Re-evaluate each
# release; drop the moment a patched `rsa` ships.
ignore = [
    # RUSTSEC-2023-0071 — Marvin Attack timing side-channel in RustCrypto `rsa`.
    # pdf_oxide uses `rsa` only for signature *verification* (public-key
    # modexp), which the advisory does not implicate. No fix released upstream.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
# pdf_oxide and this API are MIT OR Apache-2.0. Every transitive dep must be a
# permissive licence we can ship under either outward licence. allow-list only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
